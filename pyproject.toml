[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "automated-documentation-sync"
version = "0.1.0"
description = "Generate and sync documentation from local Python repositories."
requires-python = ">=3.11"
dependencies = [
    "PyYAML>=6.0",
    "packaging>=23.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=6.0"]

[project.scripts]
doc-sync = "doc_sync.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}
packages = ["doc_sync"]
